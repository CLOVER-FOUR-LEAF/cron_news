services:
  cron_news:
    build: .
    image: cron_news:latest
    container_name: cron_news
    ports:
      # 宿主使用不常用五位端口，避免与常见 8000 冲突
      - "18080:8000"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 四个持久化目录：配置文件、数据库、运行日志、图片资源
      # 均相对 compose 文件所在目录（仓库根目录）挂载，容器重建后数据不丢失
      - ./.env:/app/.env
      - ./database:/app/database
      - ./logs:/app/logs
      - ./images:/app/images
    restart: unless-stopped
