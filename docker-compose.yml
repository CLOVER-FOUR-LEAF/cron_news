services:
  cron-news:
    build: .
    image: cron-news:latest
    container_name: cron-news
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 四个持久化目录：配置文件、数据库、运行日志、图片资源
      # 均相对 compose 文件所在目录（仓库根目录）挂载，容器重建后数据不丢失
      - ./.env:/app/.env
      - ./database:/app/database
      - ./logs:/app/logs
      - ./images:/app/images
    restart: unless-stopped
