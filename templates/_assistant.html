{% if active_page != 'chat' and work_mode != 'assist' %}
<div class="assistant-float" data-assistant>
    <button type="button" class="assistant-orb" data-assistant-orb aria-label="打开 AI 资讯助手" title="问问 AI 资讯助手">
        <span class="assistant-orb-glow"></span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 2.6l2.1 4.9 5.4.6-4 3.7 1.1 5.3L12 14.4 7.4 17l1.1-5.3-4-3.7 5.4-.6L12 2.6z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            <path d="M4.5 20.6h15" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <span class="assistant-orb-dot" data-assistant-dot></span>
    </button>

    <section class="assistant-panel" data-assistant-panel aria-hidden="true" aria-label="AI 资讯助手">
        <header class="assistant-panel-head">
            <div class="assistant-panel-title">
                <span class="assistant-panel-mark">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M8 1.6l1.4 3.3 3.5.4-2.6 2.4.7 3.5L8 9.5l-3 1.7.7-3.5L3.1 5.3l3.5-.4L8 1.6z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
                    </svg>
                </span>
                <span class="assistant-panel-name">
                    <span class="assistant-panel-name-main">AI 资讯助手</span>
                    <span class="assistant-panel-sub" data-assistant-sub>记得你的阅读习惯与反馈</span>
                </span>
            </div>
            <div class="assistant-panel-actions">
                <button type="button" class="assistant-icon-btn" data-chat-new title="新对话">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                </button>
                <a class="assistant-icon-btn" href="/chat" data-chat-expand title="打开完整对话页" target="_self">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 2H2v4M10 2h4v4M6 14H2v-4M10 14h4v-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </a>
                <button type="button" class="assistant-icon-btn" data-assistant-close title="收起">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                </button>
            </div>
        </header>

        <div class="chat-mount chat-mount-float" data-chat-root data-chat-variant="float">
            <div class="chat-messages assistant-messages" data-chat-messages>
                <template data-chat-empty>
                    <div class="chat-empty assistant-empty">
                        <div class="chat-empty-icon">
                            <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
                                <path d="M12 2.5l2.1 4.9 5.4.6-4 3.7 1.1 5.3L12 14.4 7.4 17l1.1-5.3-4-3.7 5.4-.6L12 2.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
                                <path d="M4 20.5h16" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <h2>问问你的资讯助手</h2>
                        <p>记得你的阅读习惯、跟踪任务和反馈，先检索再回答。</p>
                        <div class="assistant-memory-hint" data-assistant-memory-hint hidden></div>
                        <div class="chat-suggestions">
                            <button type="button" data-q="今天有什么值得关注的新闻？">今天有什么值得关注的？</button>
                            <button type="button" data-q="给我推荐几条值得看的新闻">按我的习惯推荐几条</button>
                            <button type="button" data-q="记住：我最近在跟踪 AI 芯片的新闻">记住我在跟踪 AI 芯片</button>
                        </div>
                    </div>
                </template>
            </div>

            <div class="assistant-quick" aria-label="快捷指令">
                <button type="button" data-q="帮我采集最新新闻">采集最新</button>
                <button type="button" data-q="给我一份今天的简报">今日简报</button>
                <button type="button" data-q="给我推荐几条值得看的新闻">我的推荐</button>
            </div>

            <form class="chat-composer assistant-composer" data-chat-form>
                <textarea data-chat-input rows="1" placeholder="问点什么，或说「记住……」" maxlength="8000"></textarea>
                <div class="chat-composer-actions">
                    <button type="button" class="chat-stop-btn" data-chat-stop hidden>停止</button>
                    <button type="submit" class="chat-send-btn" data-chat-send>
                        发送
                        <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M2 8l12-6-4 12-2.5-5L2 8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
                    </button>
                </div>
                <div class="chat-hint">Enter 发送 · Shift + Enter 换行 · AI 生成内容请核对原文</div>
            </form>
        </div>
    </section>
</div>
{% endif %}
