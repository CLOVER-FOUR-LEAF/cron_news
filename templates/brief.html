<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日简报 - 定时资讯</title>
    <link rel="icon" href="/images/sign.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
    <link rel="stylesheet" href="/static/css/style.css?v=36">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    {% include "_header.html" %}

    <main>
        <div class="brief-page">
            <aside class="brief-side">
                <div class="brief-side-title">每日简报</div>
                <div class="brief-field">
                    <label>分类</label>
                    <div class="cat-dropdown" id="catDropdown">
                        <button type="button" class="cat-dropdown-btn" id="catDropdownBtn">
                            <span class="brief-dot" id="catDot"></span>
                            <span id="catLabel" class="cat-label">选择分类</span>
                            <span class="cat-arrow">
                                <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </span>
                        </button>
                        <div class="cat-dropdown-list" id="catDropdownList"></div>
                    </div>
                </div>
                <div class="brief-field">
                    <label>时间</label>
                    <div class="brief-selected-label">当前选择：<strong id="selectedDateLabel"></strong></div>
                    <div class="calendar">
                        <div class="cal-head">
                            <button type="button" class="cal-nav" id="calPrev" title="上个月">
                                <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                            <span class="cal-month" id="calMonth"></span>
                            <button type="button" class="cal-nav" id="calNext" title="下个月">
                                <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                        </div>
                        <div class="cal-weekdays">
                            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
                        </div>
                        <div class="cal-grid" id="calGrid"></div>
                    </div>
                </div>
                <div class="brief-field">
                    <label>更多操作</label>
                    <div class="brief-export">
                        <button type="button" class="btn-secondary" id="exportMdBtn">导出 Markdown</button>
                        <button type="button" class="btn-secondary" id="exportWordBtn">导出 Word</button>
                    </div>
                </div>
                <div class="brief-field">
                    <label>功能状态</label>
                    <div class="brief-toggle-row">
                        <span class="brief-toggle-text" id="briefToggleText">每日简报已开启</span>
                        <button type="button" class="switch" id="briefPageSwitch" role="switch" aria-checked="true">
                            <span class="switch-knob"></span>
                        </button>
                    </div>
                </div>
                <p class="brief-side-hint brief-side-hint-bottom">自主模式下由内置 Agent 在每次采集完成后自动生成简报；辅助模式下由外部 Agent 通过接口写入。圆点标记表示当日有简报。</p>
            </aside>

            <div class="brief-main" id="briefMain">
                <div class="loading">加载中...</div>
            </div>

            <aside class="brief-note">
                <textarea id="noteArea" class="note-area" spellcheck="false" placeholder="记录你对这期简报的想法，输入时自动保存…"></textarea>
            </aside>
        </div>
    </main>

    <script>
        const CATEGORIES = {{ categories | tojson }};
        const CAT_COLORS = {{ cat_colors | tojson }};

        const $ = id => document.getElementById(id);
        const pad2 = n => String(n).padStart(2, '0');

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        function localTodayIso() {
            const d = new Date();
            return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        }

        const params = new URLSearchParams(window.location.search);
        let currentCat = params.get('cat') && CATEGORIES.includes(params.get('cat')) ? params.get('cat') : (CATEGORIES[0] || '');
        let currentDate = /^\d{4}-\d{2}-\d{2}$/.test(params.get('date') || '') ? params.get('date') : localTodayIso();
        let briefDates = new Set();
        let viewYear, viewMonth;
        let noteDirty = false;
        let noteTimer = null;
        let currentBrief = null;

        function downloadFile(filename, content, mime) {
            const blob = new Blob([content], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 2000);
        }

        /* ===== 分类下拉 ===== */
        const dropdown = $('catDropdown');
        const list = $('catDropdownList');

        function renderCatBtn() {
            $('catLabel').textContent = currentCat;
            $('catDot').style.background = CAT_COLORS[currentCat] || '#8a8690';
        }

        list.innerHTML = CATEGORIES.map(cat => `
            <button type="button" class="cat-dropdown-item" data-cat="${escapeHtml(cat)}" style="--cat: ${CAT_COLORS[cat] || '#8a8690'}">
                <span class="brief-dot"></span>${escapeHtml(cat)}
            </button>
        `).join('');

        $('catDropdownBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            list.classList.toggle('show');
            dropdown.classList.toggle('open');
        });
        document.addEventListener('click', () => {
            list.classList.remove('show');
            dropdown.classList.remove('open');
        });
        list.querySelectorAll('.cat-dropdown-item').forEach(btn => {
            btn.addEventListener('click', () => {
                currentCat = btn.dataset.cat;
                renderCatBtn();
                list.classList.remove('show');
                dropdown.classList.remove('open');
                refreshBriefDates().then(() => {
                    renderCalendar();
                    loadBrief();
                });
            });
        });

        /* ===== 日历 ===== */
        function setCalViewFrom(iso) {
            const d = new Date(iso + 'T00:00:00');
            viewYear = d.getFullYear();
            viewMonth = d.getMonth();
        }

        function renderCalendar() {
            $('calMonth').textContent = `${viewYear} 年 ${viewMonth + 1} 月`;
            const lead = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7;
            const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
            const prevDays = new Date(viewYear, viewMonth, 0).getDate();
            const todayIso = localTodayIso();

            let html = '';
            for (let i = lead - 1; i >= 0; i--) {
                html += `<span class="cal-day other">${prevDays - i}</span>`;
            }
            for (let d = 1; d <= daysInMonth; d++) {
                const iso = `${viewYear}-${pad2(viewMonth + 1)}-${pad2(d)}`;
                const cls = ['cal-day'];
                if (iso === currentDate) cls.push('selected');
                if (iso === todayIso) cls.push('today');
                if (briefDates.has(iso)) cls.push('has-brief');
                html += `<button type="button" class="${cls.join(' ')}" data-date="${iso}">${d}</button>`;
            }
            const trail = (7 - (lead + daysInMonth) % 7) % 7;
            for (let i = 1; i <= trail; i++) {
                html += `<span class="cal-day other">${i}</span>`;
            }
            $('calGrid').innerHTML = html;

            $('calGrid').querySelectorAll('.cal-day[data-date]').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentDate = btn.dataset.date;
                    $('selectedDateLabel').textContent = currentDate;
                    renderCalendar();
                    loadBrief();
                });
            });
        }

        $('calPrev').addEventListener('click', () => {
            viewMonth -= 1;
            if (viewMonth < 0) { viewMonth = 11; viewYear -= 1; }
            renderCalendar();
        });
        $('calNext').addEventListener('click', () => {
            viewMonth += 1;
            if (viewMonth > 11) { viewMonth = 0; viewYear += 1; }
            renderCalendar();
        });

        async function refreshBriefDates() {
            try {
                const resp = await fetch(`/api/brief/dates/${encodeURIComponent(currentCat)}`);
                const data = await resp.json();
                briefDates = new Set(data.dates || []);
            } catch (e) {
                briefDates = new Set();
            }
        }

        /* ===== 简报主体 ===== */
        async function loadBrief() {
            const main = $('briefMain');
            main.innerHTML = '<div class="loading">加载中...</div>';
            loadNote();
            try {
                const resp = await fetch(`/api/brief/${encodeURIComponent(currentCat)}?date=${currentDate}`);
                if (!resp.ok) {
                    main.innerHTML = `
                        <div class="empty-state">
                            <p>${escapeHtml(currentCat)} · ${currentDate} 暂无简报</p>
                            <p class="text-dim">开启左侧「功能状态」开关后，自主模式将在采集完成后自动生成；辅助模式下由外部 Agent 写入。</p>
                        </div>`;
                    return;
                }
                const data = await resp.json();
                currentBrief = data;
                marked.setOptions({ breaks: true, gfm: true });
                main.innerHTML = `
                    <div class="brief-main-head">
                        <span class="brief-main-cat" style="--cat: ${CAT_COLORS[currentCat] || '#8a8690'}">${escapeHtml(currentCat)}</span>
                        <span class="brief-main-date">${escapeHtml(data.date)}</span>
                        <span class="brief-main-source ${data.source === '外部' ? 'ext' : ''}">${escapeHtml(data.source || '自主')}</span>
                    </div>
                    <div class="markdown-body">${marked.parse(data.content || '')}</div>
                `;
            } catch (e) {
                currentBrief = null;
                main.innerHTML = '<div class="empty-state"><p>加载失败</p></div>';
            }
        }

        /* ===== 导出 ===== */
        $('exportMdBtn').addEventListener('click', () => {
            if (!currentBrief) { showToast('当前没有可导出的简报', 'error'); return; }
            const fname = `简报_${currentCat}_${currentBrief.date}.md`;
            downloadFile(fname, currentBrief.content, 'text/markdown;charset=utf-8');
            showToast('Markdown 已导出', 'success');
        });

        $('exportWordBtn').addEventListener('click', () => {
            if (!currentBrief) { showToast('当前没有可导出的简报', 'error'); return; }
            marked.setOptions({ breaks: true, gfm: true });
            const html = `<!DOCTYPE html>
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">
<head><meta charset="utf-8"><title>${escapeHtml(currentCat)} 每日简报</title>
<style>body{font-family:SimSun,'Songti SC',serif;font-size:14px;line-height:1.9;color:#222;max-width:720px;margin:40px auto;padding:0 24px} h1,h2,h3{font-family:'Microsoft YaHei';} blockquote{border-left:3px solid #c8a852;margin:12px 0;padding:4px 14px;color:#666;background:#faf8f2}</style>
</head>
<body>
<h1>${escapeHtml(currentCat)} · 每日简报</h1>
<p style="color:#888">${escapeHtml(currentBrief.date)}</p>
<div>${marked.parse(currentBrief.content)}</div>
</body></html>`;
            const fname = `简报_${currentCat}_${currentBrief.date}.doc`;
            downloadFile(fname, html, 'application/msword;charset=utf-8');
            showToast('Word 文档已导出', 'success');
        });

        /* ===== 便签（自动保存） ===== */
        async function loadNote() {
            try {
                const resp = await fetch(`/api/brief/note?category=${encodeURIComponent(currentCat)}&date=${currentDate}`);
                const data = await resp.json();
                $('noteArea').value = data.content || '';
                noteDirty = false;
            } catch (e) {
                $('noteArea').value = '';
            }
        }

        async function saveNote() {
            if (!noteDirty) return;
            try {
                const resp = await fetch('/api/brief/note', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category: currentCat, date: currentDate, content: $('noteArea').value })
                });
                if (resp.ok) noteDirty = false;
            } catch (e) { /* 下次输入时重试 */ }
        }

        $('noteArea').addEventListener('input', () => {
            noteDirty = true;
            clearTimeout(noteTimer);
            noteTimer = setTimeout(saveNote, 800);
        });
        window.addEventListener('beforeunload', () => {
            if (noteDirty) {
                fetch('/api/brief/note', {
                    method: 'PUT',
                    keepalive: true,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category: currentCat, date: currentDate, content: $('noteArea').value })
                });
            }
        });

        /* ===== 功能开关 ===== */
        let briefEnabled = true;
        const briefSwitch = $('briefPageSwitch');
        const briefToggleText = $('briefToggleText');

        function renderBriefSwitch() {
            briefSwitch.classList.toggle('on', briefEnabled);
            briefSwitch.setAttribute('aria-checked', String(briefEnabled));
            briefToggleText.textContent = briefEnabled ? '每日简报已开启' : '每日简报已关闭';
        }

        async function loadBriefSwitch() {
            try {
                const resp = await fetch('/api/config');
                const data = await resp.json();
                briefEnabled = !!data.agent_brief_enabled;
                renderBriefSwitch();
            } catch (e) { /* 保持默认开启态 */ }
        }

        briefSwitch.addEventListener('click', async () => {
            briefEnabled = !briefEnabled;
            renderBriefSwitch();
            try {
                const resp = await fetch('/api/config', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ agent_brief_enabled: briefEnabled })
                });
                if (resp.ok) {
                    showToast(briefEnabled ? '每日简报已开启' : '每日简报已关闭', 'success');
                } else {
                    briefEnabled = !briefEnabled;
                    renderBriefSwitch();
                    showToast('保存失败', 'error');
                }
            } catch (e) {
                briefEnabled = !briefEnabled;
                renderBriefSwitch();
                showToast('保存失败', 'error');
            }
        });

        /* ===== 初始化 ===== */
        $('selectedDateLabel').textContent = currentDate;
        setCalViewFrom(currentDate);
        renderCatBtn();
        loadBriefSwitch();
        refreshBriefDates().then(() => {
            renderCalendar();
            loadBrief();
        });
    </script>
</body>
</html>
