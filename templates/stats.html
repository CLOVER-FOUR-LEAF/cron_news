<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阅读统计 - 定时资讯</title>
    <link rel="icon" href="/images/sign.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
    <link rel="stylesheet" href="/static/css/style.css?v=35">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        .stats-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px 60px;
        }
        .stats-header { margin-bottom: 32px; }
        .stats-header h1 {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .stats-header p { font-size: 0.9rem; color: var(--text-dim); }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 16px;
        }
        @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 500px) { .stats-grid { grid-template-columns: 1fr; } }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: all var(--transition-fast);
            user-select: none;
        }
        .stat-card:hover { border-color: var(--border-accent); }
        .stat-card.active { border-color: var(--accent-gold); background: var(--bg-card-hover); }
        .stat-card .stat-label { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 8px; letter-spacing: 0.05em; }
        .stat-card .stat-value { font-family: var(--font-display); font-size: 2.4rem; font-weight: 700; color: var(--text-primary); line-height: 1; }
        .stat-card .stat-sub { font-size: 0.75rem; color: var(--text-dim); margin-top: 8px; }
        .stat-card.accent-gold .stat-value { color: var(--accent-gold); }
        .stat-card.accent-green .stat-value { color: #6bc96b; }
        .stat-card.accent-red .stat-value { color: #e86b6b; }
        .stat-card.accent-blue .stat-value { color: #5cb8ff; }

        .stat-expand {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            margin-bottom: 32px;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
        }
        .stat-expand.show {
            max-height: 600px;
            opacity: 1;
            margin-bottom: 32px;
        }
        .stat-expand-inner { padding: 16px; }

        .expand-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
            font-size: 0.85rem;
        }
        .expand-pagination button {
            padding: 6px 16px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            color: var(--text-primary);
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.82rem;
            transition: all var(--transition-fast);
        }
        .expand-pagination button:hover:not(:disabled) { border-color: var(--accent-gold); color: var(--accent-gold); }
        .expand-pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
        .expand-pagination .page-info { color: var(--text-secondary); }
        .expand-pagination .page-total { color: var(--text-secondary); }

        .expand-list { display: flex; flex-direction: column; }
        .expand-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            text-decoration: none;
            color: inherit;
            transition: background var(--transition-fast);
        }
        .expand-item:hover { background: rgba(255, 255, 255, 0.03); }
        .expand-item .item-cat {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .expand-item .item-title {
            flex: 1;
            font-size: 0.88rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .expand-item .item-source {
            font-size: 0.72rem;
            color: var(--text-dim);
            flex-shrink: 0;
            max-width: 70px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .expand-item .item-time { font-size: 0.72rem; color: var(--text-dim); flex-shrink: 0; font-variant-numeric: tabular-nums; }
        .expand-item .item-status { font-size: 0.7rem; font-weight: 500; flex-shrink: 0; width: 28px; text-align: center; }
        .expand-item .item-status.read { color: #6bc96b; }
        .expand-item .item-status.unread { color: #e86b6b; }
        .expand-item .item-status.reading { color: #e8b45a; }
        .expand-empty { text-align: center; padding: 40px; color: var(--text-dim); font-size: 0.85rem; }

        .stats-section { margin-bottom: 40px; }
        .stats-section-title {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .section-hint {
            font-family: var(--font-body);
            font-size: 0.75rem;
            font-weight: 400;
            color: var(--text-dim);
            margin-left: 12px;
        }
        .charts-row { display: flex; gap: 24px; }
        @media (max-width: 800px) { .charts-row { flex-direction: column; } }
        .chart-card {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 24px;
            position: relative;
            min-width: 0;
        }
        .chart-card h3 {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .chart-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }
        .chart-card-head .segmented-btn { padding: 4px 14px; font-size: 0.75rem; }
        .pie-chart-wrapper { display: flex; align-items: center; gap: 24px; height: 280px; }
        @media (max-width: 600px) { .pie-chart-wrapper { flex-direction: column; height: auto; } }
        .pie-chart-canvas { flex: 1; max-width: 220px; }
        .pie-legend { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 280px; }
        .pie-legend-item { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; }
        .pie-legend-item.zero { opacity: 0.4; }
        .pie-legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .pie-legend-name { color: var(--text-secondary); min-width: 36px; }
        .pie-legend-count { color: var(--text-primary); font-weight: 600; min-width: 30px; text-align: right; }
        .pie-legend-percent { color: var(--text-dim); font-size: 0.75rem; }
        .bar-chart-wrapper { height: 280px; }

        .chart-tip {
            position: absolute;
            pointer-events: none;
            background: var(--bg-elevated);
            border: 1px solid var(--border-accent);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.75rem;
            color: var(--text-primary);
            opacity: 0;
            transition: opacity 0.15s;
            white-space: nowrap;
            z-index: 10;
        }

        .dash-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
        @media (max-width: 900px) { .dash-kpis { grid-template-columns: 1fr; } }
        .dash-kpi {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 20px 24px;
            transition: all var(--transition-fast);
        }
        .dash-kpi:hover { border-color: var(--border-accent); }
        .dash-kpi .kpi-value {
            font-family: var(--font-display);
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }
        .dash-kpi .kpi-label { font-size: 0.78rem; color: var(--text-dim); margin-top: 8px; letter-spacing: 0.03em; }
        .dash-kpi.gold .kpi-value { color: var(--accent-gold); }

        .dash-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 1000px) { .dash-row { grid-template-columns: 1fr; } }
        .line-chart-wrapper { height: 260px; }

        .heat-main { width: 100%; min-width: 0; overflow-x: auto; display: flex; flex-direction: column; }
        .heat-months {
            position: relative;
            margin-left: 26px;
            height: 16px;
            font-size: 0.62rem;
            color: var(--text-dim);
            overflow: hidden;
        }
        .heat-months span { position: absolute; white-space: nowrap; }
        .heat-body { display: flex; gap: 6px; margin-top: 4px; }
        .heat-weekdays {
            display: grid;
            grid-template-rows: repeat(7, 10px);
            gap: 3px;
            width: 20px;
            font-size: 0.6rem;
            color: var(--text-dim);
            flex-shrink: 0;
        }
        .heat-weekdays span { display: flex; align-items: center; }
        .heat-grid {
            display: grid;
            grid-template-rows: repeat(7, 10px);
            grid-auto-flow: column;
            grid-auto-columns: 10px;
            gap: 3px;
        }
        .heat-cell { width: 10px; height: 10px; border-radius: 3px; background: rgba(255, 255, 255, 0.05); }
        .heat-cell.future { background: transparent; }
        .heat-legend {
            display: flex;
            align-items: center;
            gap: 4px;
            justify-content: flex-end;
            margin-top: 12px;
            font-size: 0.65rem;
            color: var(--text-dim);
        }
        .heat-legend .heat-cell { cursor: default; }
        .heat-stats { display: flex; flex-direction: row; gap: 12px; margin-top: 16px; }
        @media (max-width: 620px) { .heat-stats { flex-direction: column; } }
        .heat-stat {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 14px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .heat-stat .hs-value {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
        }
        .heat-stat.gold .hs-value { color: var(--accent-gold); }
        .heat-stat .hs-label { font-size: 0.7rem; color: var(--text-dim); margin-top: 4px; }

        .recent-list { display: flex; flex-direction: column; gap: 12px; }
        .recent-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            transition: all var(--transition-fast);
            text-decoration: none;
            color: inherit;
        }
        .recent-item:hover { border-color: var(--border-accent); }
        .recent-item .item-title { flex: 1; font-size: 0.9rem; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .recent-item .item-cat { font-size: 0.72rem; font-weight: 600; padding: 3px 8px; border-radius: 4px; flex-shrink: 0; }
        .recent-item .item-source { font-size: 0.75rem; color: var(--text-dim); flex-shrink: 0; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .recent-item .item-time { font-size: 0.75rem; color: var(--text-dim); flex-shrink: 0; font-variant-numeric: tabular-nums; }
        .recent-item .item-status { font-size: 0.72rem; font-weight: 500; flex-shrink: 0; width: 32px; text-align: center; }
        .recent-item .item-status.read { color: #6bc96b; }
        .recent-item .item-status.unread { color: #e86b6b; }
        .recent-item .item-status.reading { color: #e8b45a; }
    </style>
</head>
<body>
    {% include "_header.html" %}

    <main>
        <div class="stats-container">
            <div class="stats-header">
                <h1>阅读统计</h1>
                <p>你的新闻阅读数据概览</p>
            </div>

            <div class="stats-grid" id="statsGrid"></div>
            <div class="stat-expand" id="statExpand">
                <div class="stat-expand-inner">
                    <div class="expand-pagination" id="expandPagination"></div>
                    <div class="expand-list" id="expandList"></div>
                </div>
            </div>

            <div class="stats-section">
                <div class="stats-section-title">仪表盘</div>
                <div class="dash-kpis" id="dashKpis"></div>
                <div class="dash-row">
                    <div class="chart-card">
                        <div class="chart-card-head">
                            <h3>阅读趋势</h3>
                            <div class="segmented" id="lineRangeSeg">
                                <button class="segmented-btn active" data-days="7">近 7 天</button>
                                <button class="segmented-btn" data-days="30">近 30 天</button>
                            </div>
                        </div>
                        <div class="line-chart-wrapper"><canvas id="readLineChart"></canvas></div>
                    </div>
                    <div class="chart-card">
                        <div class="chart-card-head">
                            <h3>阅读热力图</h3>
                        </div>
                        <div class="heat-main" id="heatMain">
                            <div class="heat-months" id="heatMonths"></div>
                            <div class="heat-body">
                                <div class="heat-weekdays" id="heatWeekdays"></div>
                                <div class="heat-grid" id="heatGrid"></div>
                            </div>
                            <div class="heat-legend" id="heatLegend"></div>
                        </div>
                        <div class="chart-tip heat-tip" id="heatTip"></div>
                        <div class="heat-stats" id="heatStats"></div>
                    </div>
                </div>
            </div>

            <div class="stats-section">
                <div class="stats-section-title">数据分析</div>
                <div class="charts-row">
                    <div class="chart-card">
                        <div class="chart-card-head">
                            <h3>各分类新闻数量</h3>
                        </div>
                        <div class="pie-chart-wrapper">
                            <div class="pie-chart-canvas"><canvas id="categoryPieChart"></canvas></div>
                            <div class="pie-legend" id="pieLegend"></div>
                        </div>
                    </div>
                    <div class="chart-card">
                        <div class="chart-card-head">
                            <h3>新闻收录趋势</h3>
                            <div class="segmented" id="barRangeSeg">
                                <button class="segmented-btn active" data-days="7">近 7 天</button>
                                <button class="segmented-btn" data-days="30">近 30 天</button>
                            </div>
                        </div>
                        <div class="bar-chart-wrapper"><canvas id="dailyBarChart"></canvas></div>
                        <div class="chart-tip" id="barTip"></div>
                    </div>
                </div>
            </div>

            <div class="stats-section">
                <div class="stats-section-title">最近在读</div>
                <div class="recent-list" id="readingList"></div>
            </div>

            <div class="stats-section">
                <div class="stats-section-title">最近阅读</div>
                <div class="recent-list" id="recentList"></div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <span>定时资讯 &copy; 2026 &mdash; AI 新闻聚合平台</span>
    </footer>

    <script>
        const CATEGORIES = {{ categories | tojson }};
        const CAT_COLORS = {{ cat_colors | tojson }};
        const DEFAULT_COLOR = '#8a8690';

        let pieChart = null, barChart = null, lineChart = null;
        let STATS = null;
        let barRange = 7, lineRange = 7;
        let barView = [];
        let activeCard = null;
        let expandType = '';
        let expandPage = 1;
        let expandTotal = 0;
        const PAGE_SIZE = 10;

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        function formatTime(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            const pad = n => String(n).padStart(2, '0');
            return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        const pad2 = n => String(n).padStart(2, '0');
        const isoOf = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;

        function tickLabel(iso, range) {
            const d = new Date(iso + 'T00:00:00');
            if (range === 30) {
                return d.getDate() === 1 ? `${d.getMonth()+1}月` : pad2(d.getDate());
            }
            return `${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
        }

        function fullLabel(iso) {
            const d = new Date(iso + 'T00:00:00');
            return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
        }

        function lastNDays(n) {
            const out = [];
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            for (let i = n - 1; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                out.push(isoOf(d));
            }
            return out;
        }

        function catColor(name) {
            return CAT_COLORS[name] || DEFAULT_COLOR;
        }

        async function loadStats() {
            try {
                const resp = await fetch('/api/stats');
                STATS = await resp.json();
                renderStats(STATS);
                renderDash(STATS);
                renderCategoryPieChart(STATS.category_stats);
                renderDailyBarChart();
                renderRecentReading(STATS.recent_reading);
                renderRecentReads(STATS.recent_reads);
            } catch (e) {
                console.error('Failed to load stats:', e);
            }
        }

        function renderStats(data) {
            const grid = document.getElementById('statsGrid');
            const readRate = data.total > 0 ? Math.round((data.read_count / data.total) * 100) : 0;
            grid.innerHTML = `
                <div class="stat-card accent-gold" data-type="all" onclick="toggleExpand('all', this)">
                    <div class="stat-label">新闻总数</div>
                    <div class="stat-value">${data.total}</div>
                    <div class="stat-sub">全部新闻 · 点击展开</div>
                </div>
                <div class="stat-card accent-green" data-type="read" onclick="toggleExpand('read', this)">
                    <div class="stat-label">已阅读</div>
                    <div class="stat-value">${data.read_count}</div>
                    <div class="stat-sub">占比 ${readRate}% · 点击展开</div>
                </div>
                <div class="stat-card accent-red" data-type="unread" onclick="toggleExpand('unread', this)">
                    <div class="stat-label">未阅读</div>
                    <div class="stat-value">${data.unread_count}</div>
                    <div class="stat-sub">待阅读 · 点击展开</div>
                </div>
                <div class="stat-card accent-blue" data-type="today" onclick="toggleExpand('today', this)">
                    <div class="stat-label">今日新增</div>
                    <div class="stat-value">${data.today_count}</div>
                    <div class="stat-sub">今日收录 · 点击展开</div>
                </div>
            `;
        }

        function toggleExpand(type, cardEl) {
            const expandEl = document.getElementById('statExpand');
            if (activeCard === type) {
                expandEl.classList.remove('show');
                cardEl.classList.remove('active');
                activeCard = null;
                return;
            }
            document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
            cardEl.classList.add('active');
            activeCard = type;
            expandType = type;
            expandPage = 1;
            expandEl.classList.add('show');
            loadExpandPage();
        }

        async function loadExpandPage() {
            const listEl = document.getElementById('expandList');
            const pagEl = document.getElementById('expandPagination');
            listEl.innerHTML = '<div class="expand-empty">加载中...</div>';
            pagEl.innerHTML = '';

            let url = `/api/news?page=${expandPage}&page_size=${PAGE_SIZE}`;
            if (expandType === 'read') url += '&is_read=1';
            else if (expandType === 'unread') url += '&is_read=0';
            else if (expandType === 'today') url += '&today_only=true';

            try {
                const resp = await fetch(url);
                const data = await resp.json();
                expandTotal = data.total;
                const totalPages = Math.ceil(expandTotal / PAGE_SIZE);

                if (data.items.length === 0) {
                    listEl.innerHTML = '<div class="expand-empty">暂无数据</div>';
                    return;
                }

                listEl.innerHTML = data.items.map(item => {
                    const color = item.category_color || CAT_COLORS[item.category_name] || '#888';
                    return `
                        <a href="/news/${item.id}" class="expand-item">
                            <span class="item-cat" style="color:${color};border:1px solid ${color}30;background:${color}10">${escapeHtml(item.category_name || '默认')}</span>
                            <span class="item-title">${escapeHtml(item.title)}</span>
                            <span class="item-source">${escapeHtml(item.source || '未知')}</span>
                            <span class="item-time">${formatTime(item.collected_at)}</span>
                            <span class="item-status ${item.is_read?'read':(item.is_reading?'reading':'unread')}">${item.is_read?'已读':(item.is_reading?'在读':'未读')}</span>
                        </a>
                    `;
                }).join('');

                pagEl.innerHTML = `
                    <button onclick="goExpandPage(${expandPage - 1})" ${expandPage <= 1 ? 'disabled' : ''}>上一页</button>
                    <span class="page-info">第 ${expandPage} / ${totalPages} 页</span>
                    <button onclick="goExpandPage(${expandPage + 1})" ${expandPage >= totalPages ? 'disabled' : ''}>下一页</button>
                    <span class="page-total">共 ${expandTotal} 条</span>
                `;
            } catch (e) {
                listEl.innerHTML = '<div class="expand-empty">加载失败</div>';
            }
        }

        function goExpandPage(page) {
            const totalPages = Math.ceil(expandTotal / PAGE_SIZE) || 1;
            if (page < 1 || page > totalPages) return;
            expandPage = page;
            loadExpandPage();
        }

        function readSeries(days) {
            const byDay = (STATS && STATS.read_by_day) || {};
            return lastNDays(days).map(iso => ({ date: iso, count: byDay[iso] || 0 }));
        }

        function renderDash(data) {
            const byDay = data.read_by_day || {};
            const days7 = lastNDays(7), days30 = lastNDays(30);
            const sum = list => list.reduce((s, iso) => s + (byDay[iso] || 0), 0);
            const today = days7[days7.length - 1];

            document.getElementById('dashKpis').innerHTML = `
                <div class="dash-kpi gold">
                    <div class="kpi-value">${byDay[today] || 0}</div>
                    <div class="kpi-label">当天阅读数 · ${today.slice(5).replace('-', '/')}</div>
                </div>
                <div class="dash-kpi">
                    <div class="kpi-value">${sum(days7)}</div>
                    <div class="kpi-label">近7天阅读数</div>
                </div>
                <div class="dash-kpi">
                    <div class="kpi-value">${sum(days30)}</div>
                    <div class="kpi-label">近30天阅读数</div>
                </div>
            `;

            renderLineChart();
            renderHeatmap(byDay, data.read_count || 0);
        }

        function renderLineChart() {
            const ctx = document.getElementById('readLineChart').getContext('2d');
            if (lineChart) lineChart.destroy();

            const series = readSeries(30).slice(30 - lineRange);
            const gradient = ctx.createLinearGradient(0, 0, 0, 260);
            gradient.addColorStop(0, 'rgba(200, 168, 82, 0.28)');
            gradient.addColorStop(1, 'rgba(200, 168, 82, 0)');

            lineChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: series.map(d => d.date),
                    datasets: [{
                        data: series.map(d => d.count),
                        borderColor: '#c8a852',
                        backgroundColor: gradient,
                        fill: true,
                        tension: 0,
                        borderWidth: 2,
                        pointRadius: lineRange === 7 ? 3 : 2,
                        pointBackgroundColor: '#c8a852',
                        pointBorderColor: 'rgba(11,11,15,0.8)',
                        pointHoverRadius: 5,
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(24,24,30,0.95)',
                            borderColor: 'rgba(200,168,82,0.4)',
                            borderWidth: 1,
                            titleColor: '#e8e4dc',
                            bodyColor: '#c8a852',
                            displayColors: false,
                            callbacks: {
                                title: items => fullLabel(items[0].label),
                                label: c => `阅读 ${c.raw} 条`
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: '#8a8690',
                                font: { size: lineRange === 30 ? 9 : 11 },
                                autoSkip: false,
                                maxRotation: 0,
                                callback: function (value, index) {
                                    return tickLabel(this.getLabelForValue(value), lineRange);
                                }
                            },
                            grid: { color: 'rgba(42,42,50,0.5)' }
                        },
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#8a8690', precision: 0, font: { size: 11 } },
                            grid: { color: 'rgba(42,42,50,0.5)' }
                        }
                    }
                }
            });
        }

        const HEAT_LEVELS = [
            { min: 7, color: 'rgba(200, 168, 82, 0.95)' },
            { min: 4, color: 'rgba(200, 168, 82, 0.65)' },
            { min: 2, color: 'rgba(200, 168, 82, 0.4)' },
            { min: 1, color: 'rgba(200, 168, 82, 0.2)' },
        ];
        const HEAT_EMPTY = 'rgba(255, 255, 255, 0.05)';

        function heatColor(count) {
            for (const lv of HEAT_LEVELS) if (count >= lv.min) return lv.color;
            return count > 0 ? HEAT_LEVELS[HEAT_LEVELS.length - 1].color : HEAT_EMPTY;
        }

        function renderHeatmap(byDay, totalReads) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const mainEl = document.getElementById('heatMain');
            const avail = (mainEl ? mainEl.clientWidth : 490) - 26;
            const WEEKS = Math.max(20, Math.min(52, Math.floor(avail / 13)));

            const start = new Date(today);
            start.setDate(start.getDate() - ((WEEKS - 1) * 7 + (start.getDay() + 6) % 7));

            const weeks = [];
            const cursor = new Date(start);
            while (cursor <= today) {
                const week = [];
                for (let i = 0; i < 7; i++) {
                    week.push(new Date(cursor));
                    cursor.setDate(cursor.getDate() + 1);
                }
                weeks.push(week);
            }

            const monthsEl = document.getElementById('heatMonths');
            let monthHtml = '', lastMonth = -1;
            weeks.forEach((week, wi) => {
                let label = '';
                for (const d of week) {
                    if (d.getDate() === 1 && d.getMonth() !== lastMonth) {
                        label = `${d.getMonth() + 1}月`;
                        lastMonth = d.getMonth();
                        break;
                    }
                }
                if (wi === 0 && label === '') {
                    label = `${week[0].getMonth() + 1}月`;
                    lastMonth = week[0].getMonth();
                }
                monthHtml += `<span style="left:${wi * 13}px">${label}</span>`;
            });
            monthsEl.innerHTML = monthHtml;

            document.getElementById('heatWeekdays').innerHTML =
                ['一', '二', '三', '四', '五', '六', '日'].map(w => `<span>${w}</span>`).join('');

            let gridHtml = '';
            weeks.forEach(week => {
                week.forEach(d => {
                    if (d > today) {
                        gridHtml += '<span class="heat-cell future"></span>';
                        return;
                    }
                    const iso = isoOf(d);
                    const count = byDay[iso] || 0;
                    gridHtml += `<span class="heat-cell" data-date="${iso}" data-count="${count}" style="background:${heatColor(count)}"></span>`;
                });
            });
            document.getElementById('heatGrid').innerHTML = gridHtml;

            document.getElementById('heatLegend').innerHTML =
                `少 <span class="heat-cell" style="background:${HEAT_EMPTY}"></span>` +
                [1, 2, 4, 7].map(n => `<span class="heat-cell" style="background:${heatColor(n)}"></span>`).join('') +
                ' 多';

            const counts = Object.values(byDay);
            const maxDay = counts.length ? Math.max(...counts) : 0;
            const activeDays = counts.filter(c => c > 0).length;

            document.getElementById('heatStats').innerHTML = `
                <div class="heat-stat gold">
                    <div class="hs-value">${totalReads}</div>
                    <div class="hs-label">累计阅读数</div>
                </div>
                <div class="heat-stat">
                    <div class="hs-value">${maxDay}</div>
                    <div class="hs-label">单日阅读数最多</div>
                </div>
                <div class="heat-stat">
                    <div class="hs-value">${activeDays}</div>
                    <div class="hs-label">活跃天数</div>
                </div>
            `;
        }

        function bindHeatTip() {
            const grid = document.getElementById('heatGrid');
            const tip = document.getElementById('heatTip');
            if (!grid || !tip) return;
            grid.addEventListener('mouseover', (e) => {
                const cell = e.target.closest('.heat-cell');
                if (!cell || !cell.dataset.date) { tip.style.opacity = 0; return; }
                const count = parseInt(cell.dataset.count, 10) || 0;
                tip.textContent = `${cell.dataset.date} · ${count > 0 ? `阅读 ${count} 条` : '无阅读'}`;
                const card = tip.parentElement;
                const rect = card.getBoundingClientRect();
                const cx = e.clientX - rect.left + 12;
                const cy = e.clientY - rect.top + 8;
                tip.style.left = Math.min(cx, card.clientWidth - 150) + 'px';
                tip.style.top = cy + 'px';
                tip.style.opacity = 1;
            });
            grid.addEventListener('mouseleave', () => { tip.style.opacity = 0; });
        }

        function renderCategoryPieChart(categoryStats) {
            const ctx = document.getElementById('categoryPieChart').getContext('2d');
            if (pieChart) pieChart.destroy();

            const labels = [], values = [], colors = [];
            let total = 0;
            CATEGORIES.forEach(cat => {
                const count = categoryStats[cat] || 0;
                if (count > 0) { labels.push(cat); values.push(count); colors.push(catColor(cat)); total += count; }
            });

            pieChart = new Chart(ctx, {
                type: 'pie',
                data: { labels, datasets: [{ data: values, backgroundColor: colors, borderColor: 'rgba(11,11,15,0.8)', borderWidth: 2 }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: c => ` ${c.label}: ${c.raw} 篇 (${Math.round(c.raw/total*100)}%)` } }
                    }
                }
            });

            document.getElementById('pieLegend').innerHTML = CATEGORIES.map(cat => {
                const count = categoryStats[cat] || 0;
                const percent = total > 0 ? Math.round(count / total * 100) : 0;
                return `
                    <div class="pie-legend-item ${count === 0 ? 'zero' : ''}">
                        <span class="pie-legend-dot" style="background:${catColor(cat)}"></span>
                        <span class="pie-legend-name">${escapeHtml(cat)}</span>
                        <span class="pie-legend-count">${count}篇</span>
                        <span class="pie-legend-percent">${percent}%</span>
                    </div>
                `;
            }).join('');
        }

        function renderDailyBarChart() {
            const ctx = document.getElementById('dailyBarChart').getContext('2d');
            if (barChart) barChart.destroy();

            barView = (STATS.daily_stats || []).slice(30 - barRange);

            const catTotals = {};
            barView.forEach(d => Object.entries(d.by_category).forEach(([cat, n]) => {
                catTotals[cat] = (catTotals[cat] || 0) + n;
            }));
            const cats = CATEGORIES.filter(c => catTotals[c]);
            Object.keys(catTotals).forEach(c => { if (!cats.includes(c)) cats.push(c); });

            const datasets = cats.map(cat => ({
                label: cat,
                data: barView.map(d => d.by_category[cat] || 0),
                backgroundColor: catColor(cat),
                stack: 'news',
                borderWidth: 0,
                borderRadius: barRange === 7 ? 3 : 1,
                maxBarThickness: barRange === 7 ? 34 : 12,
            }));

            barChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: barView.map(d => d.date), datasets },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(24,24,30,0.95)',
                            borderColor: 'rgba(200,168,82,0.4)',
                            borderWidth: 1,
                            titleColor: '#e8e4dc',
                            bodyColor: '#e8e4dc',
                            footerColor: '#c8a852',
                            displayColors: true,
                            boxWidth: 8,
                            boxHeight: 8,
                            usePointStyle: true,
                            callbacks: {
                                title: items => fullLabel(items[0].label),
                                label: c => ` ${c.dataset.label}：${c.raw} 篇`,
                                footer: items => `当日新增共 ${barView[items[0].dataIndex].count} 篇`
                            }
                        }
                    },
                    scales: {
                        x: {
                            stacked: true,
                            ticks: {
                                color: '#8a8690',
                                font: { size: barRange === 30 ? 9 : 11 },
                                autoSkip: false,
                                maxRotation: 0,
                                callback: function (value, index) {
                                    return tickLabel(this.getLabelForValue(value), barRange);
                                }
                            },
                            grid: { display: false }
                        },
                        y: {
                            stacked: true,
                            beginAtZero: true,
                            ticks: { color: '#8a8690', precision: 0, font: { size: 11 } },
                            grid: { color: 'rgba(42,42,50,0.5)' }
                        }
                    }
                }
            });
        }

        function attachBarAxisTip() {
            const canvas = document.getElementById('dailyBarChart');
            const tip = document.getElementById('barTip');
            canvas.addEventListener('mousemove', (e) => {
                if (!barChart || !barChart.chartArea) { tip.style.opacity = 0; return; }
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left, y = e.clientY - rect.top;
                const area = barChart.chartArea;
                if (y > area.bottom && y <= area.bottom + 26 && x >= area.left - 4 && x <= area.right + 4) {
                    const idx = Math.round(barChart.scales.x.getValueForPixel(x));
                    if (idx >= 0 && idx < barView.length) {
                        const d = barView[idx];
                        tip.textContent = `${fullLabel(d.date)} 新增共 ${d.count} 篇`;
                        tip.style.left = Math.min(x + 14, canvas.offsetWidth - 140) + 'px';
                        tip.style.top = (canvas.offsetTop + y - 30) + 'px';
                        tip.style.opacity = 1;
                        return;
                    }
                }
                tip.style.opacity = 0;
            });
            canvas.addEventListener('mouseleave', () => { tip.style.opacity = 0; });
        }

        function bindRangeSeg(segId, onChange) {
            const seg = document.getElementById(segId);
            seg.addEventListener('click', (e) => {
                const btn = e.target.closest('.segmented-btn');
                if (!btn || btn.classList.contains('active')) return;
                seg.querySelectorAll('.segmented-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                onChange(parseInt(btn.dataset.days, 10));
            });
        }

        function renderRecentReading(reads) {
            const container = document.getElementById('readingList');
            if (!reads || reads.length === 0) { container.innerHTML = '<div class="expand-empty">暂无在读内容</div>'; return; }
            container.innerHTML = reads.map(item => {
                const color = item.category_color || CAT_COLORS[item.category_name] || '#888';
                return `
                    <a href="/news/${item.id}" class="recent-item">
                        <span class="item-cat" style="color:${color};border:1px solid ${color}30;background:${color}10">${escapeHtml(item.category_name || '默认')}</span>
                        <span class="item-title">${escapeHtml(item.title)}</span>
                        <span class="item-source">${escapeHtml(item.source || '未知来源')}</span>
                        <span class="item-time">${formatTime(item.reading_at || item.collected_at)}</span>
                        <span class="item-status reading">在读</span>
                    </a>
                `;
            }).join('');
        }

        function renderRecentReads(reads) {
            const container = document.getElementById('recentList');
            if (!reads || reads.length === 0) { container.innerHTML = '<div class="expand-empty">暂无阅读记录</div>'; return; }
            container.innerHTML = reads.map(item => {
                const color = item.category_color || CAT_COLORS[item.category_name] || '#888';
                return `
                    <a href="/news/${item.id}" class="recent-item">
                        <span class="item-cat" style="color:${color};border:1px solid ${color}30;background:${color}10">${escapeHtml(item.category_name || '默认')}</span>
                        <span class="item-title">${escapeHtml(item.title)}</span>
                        <span class="item-source">${escapeHtml(item.source || '未知来源')}</span>
                        <span class="item-time">${formatTime(item.read_at || item.collected_at)}</span>
                        <span class="item-status ${item.is_read?'read':(item.is_reading?'reading':'unread')}">${item.is_read?'已读':(item.is_reading?'在读':'未读')}</span>
                    </a>
                `;
            }).join('');
        }

        bindRangeSeg('lineRangeSeg', days => { lineRange = days; renderLineChart(); });
        bindRangeSeg('barRangeSeg', days => { barRange = days; renderDailyBarChart(); });
        attachBarAxisTip();
        bindHeatTip();
        loadStats();
    </script>
</body>
</html>
